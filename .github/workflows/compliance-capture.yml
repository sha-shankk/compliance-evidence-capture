name: Privacy Policy Compliance Capture

# Fully automated: scheduled + manually triggerable. No manual steps inside.
on:
  schedule:
    - cron: "0 6 * * 1"      # every Monday 06:00 UTC
  workflow_dispatch: {}

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Capture also auto-fetches the TSA certs and self-verifies the bundle.
      # If integrity or the trusted timestamp fails, the script exits non-zero
      # and the whole job fails — a broken capture can't pass silently.
      - name: Capture + self-verify
        run: |
          python capture_policy.py \
            --url "https://www.mindtickle.com/legal/privacy-policy/" \
            --out evidence \
            --tsa-provider freetsa

      # Store the bundle as a retained, immutable CI artifact (audit trail).
      - name: Upload evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: privacy-policy-evidence-${{ github.run_id }}
          path: evidence/
          retention-days: 90
